[build]
  publish = "."
  functions = "netlify/functions"

# O formulário envia para /enviar-pedido, que corre a função lead.js
[[redirects]]
  from = "/enviar-pedido"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

[[headers]]
  for = "/Imagens/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/Plantas/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
